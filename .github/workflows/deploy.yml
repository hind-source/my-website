
name: Deploy Node.js Application website

 

on:
  push:
    branches:
      - development

 

jobs:
  deploy:
    runs-on: ubuntu-latest

 

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

 

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

 

    - name: Install dependencies
      run: npm install

 

    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_KEY: ${{ secrets.EC2_KEY }}
        EC2_APP_PATH: ${{ secrets.EC2WEBSITE_APP_PATH }}
      run: |
        echo "$EC2_KEY" > ec2_key.pem
        chmod 600 ec2_key.pem

 

        # Upload source files (no node_modules)
        rsync -avz --exclude=node_modules --exclude=.git \
          -e "ssh -i ec2_key.pem -o StrictHostKeyChecking=no" \
          ./ $EC2_USER@$EC2_HOST:$EC2_APP_PATH

 

        # Connect to EC2 and deploy
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
          cd $EC2_APP_PATH || exit

 

          echo "Installing dependencies on EC2"
          npm install

 

         echo "Building production build"
            npm run build

 

          echo "Stopping old PM2 process"
          pm2 stop ienergy-websitenew || true
          pm2 delete ienergy-websitenew || true

 

          echo "Starting new production UI websiteserver on port 3000"
          pm2 start "serve -s build -l 3000" --name ienergy-websitenew

 

          pm2 save
        EOF

 

        rm -f ec2_key.pem


